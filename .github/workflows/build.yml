name: Build Cross-Platform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (OpenCL)
    runs-on: ubuntu-22.04
    env:
      CHUNKUP_BUILD_CONFIG: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ pkg-config python3 opencl-headers ocl-icd-opencl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustc --version

      - name: Build Linux native engine
        run: |
          source "$HOME/.cargo/env"
          bash scripts/build-engine.sh Release

      - name: Build Linux mod JAR
        run: |
          source "$HOME/.cargo/env"
          chmod +x gradlew
          ./gradlew :remapJar --no-daemon -Pmod_version=${{ github.ref_name }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/remapped/*.jar
            build/native-gpu/*.so
            native/opencl/kernels/*.cl
            native/opencl/kernels/*.clh

  build-windows:
    name: Build Windows (CUDA + OpenCL)
    runs-on: windows-2022
    env:
      CHUNKUP_BUILD_CONFIG: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup MSVC vcvars
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows native engine
        shell: pwsh
        run: |
          ./scripts/build-engine.ps1 -Configuration Release -ForceCuda

      - name: Build Windows mod JAR
        run: |
          .\gradlew.bat remapJar --no-daemon -Pmod_version=${{ github.ref_name }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            build/remapped/*.jar
            build/native-gpu/*.dll
            build/native-gpu/*.pdb
            native/prebuilt/windows-x86_64/*.dll

  merge-artifacts:
    name: Merge & Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Prepare cross-platform JAR
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          JAR_NAME="chunkup-${VERSION}.jar"
          
          # Use the Linux-built JAR as base (has Linux .so + prebuilt Windows .dll)
          mkdir -p release
          cp artifacts/linux/*.jar release/${JAR_NAME}
          
          # Verify both platforms' natives are present
          echo "=== JAR contents ==="
          unzip -l release/${JAR_NAME} 'assets/chunkup/native/**' | head -40
          
          # Verify Linux .so
          unzip -l release/${JAR_NAME} 'assets/chunkup/native/linux-x86_64/*.so'
          # Verify Windows .dll
          unzip -l release/${JAR_NAME} 'assets/chunkup/native/windows-x86_64/*.dll'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}